    networks:
      - foodlyst-microservices-springboot
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: eureka-server
      MYSQL_HOST: mysql-foodlyst
      ZIPKIN_HOST: zipkin
