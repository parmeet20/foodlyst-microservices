    depends_on:
      - config-server
      - eureka-server
      - mysql
    networks:
      - foodlyst-microservices-springboot
    environment:
      CONFIG_SERVER_HOST: config-server
      EUREKA_URL: eureka-server
      MYSQL_HOST: mysql-foodlyst
      ZIPKIN_HOST: zipkin
      KAFKA_HOST: kafkafoodlyst
      EMAIL_USERNAME: param9999.singh@gmail.com
      EMAIL_PASSWORD: yrhbnhjqwecwowdf

  gateway-service:
    build: ./gateway
    container_name: gateway-service
    ports:
