apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}-headless
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
    - name: broker
      port: 9092
      targetPort: 9092
