# Default values for mysql.
nameOverride: "mysql"
fullnameOverride: "mysql"
namespace: "foodlyst-microservice"

replicaCount: 1

image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3306

auth:
  rootPassword: "password"
  database: "user"
  user: "foodlyst_user"
  password: "password"
  existingSecret: "mysql-secret"

initScripts:
  enabled: true

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
