# Default values for order-service.
nameOverride: "order-service"
fullnameOverride: "order-service"
namespace: "foodlyst-microservice"

replicaCount: 1

image:
  repository: param9999/order-service
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

env:
  - name: CONFIG_SERVER_HOST
    value: "config-server"
  - name: MYSQL_HOST
    value: "mysql"
  - name: MYSQL_PORT
    value: "3306"
  - name: MYSQL_DATABASE
    value: "orders"
  - name: MYSQL_USER
    value: "foodlyst_user"
  - name: MYSQL_PASSWORD
    value: "password"
  - name: EUREKA_URL
    value: "eureka-server"
  - name: KAFKA_HOST
    value: "kafka"
  - name: ZIPKIN_HOST
    value: "zipkin"

livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 20
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
